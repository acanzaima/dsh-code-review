name: Publish

# A tag push from the local machine (`git push origin v0.2.1`) and a tag created
# on the GitHub web UI (Tags -> New tag, or a Release whose tag does not exist
# yet) both produce a `push` event for the tag ref, so one trigger covers both.
# The workflow file must already be on the tagged commit.
on:
  push:
    tags:
      - 'v*'

# Trusted Publishing: npm verifies this exact workflow through GitHub's OIDC
# token, so no long-lived NPM_TOKEN secret is needed. `id-token: write` is what
# lets the job request that OIDC token; npm adds provenance automatically.
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Must match the "Environment name" of the npm Trusted Publisher connection;
    # add required reviewers here if releases should need a manual approval.
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Trusted Publishing needs npm CLI >= 11.5; Node 22 ships npm 10.
      # Pin the npm major so a future npm 12 cannot silently change behaviour.
      - name: Upgrade npm for Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11
          npm --version

      - name: Verify the tag matches package.json
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $expected; bump the version and retag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json"

      # scripts/release.mjs is the single release entry point: validate -> test ->
      # build -> pack -> auth -> version -> publish. Under GitHub OIDC the auth
      # step is skipped (there is no token); npm exchanges the OIDC token itself.
      # `--tag next` keeps pre-release versions off the `latest` dist-tag.
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm run release -- --tag next
          else
            npm run release
          fi
